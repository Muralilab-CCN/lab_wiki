site_name: Murali Lab Wiki
site_description: Internal documentation and protocols for Murali Lab, IIT Jodhpur.
site_url: https://muralilab.github.io/lab_wiki/  # <-- You can adjust this to your exact GitHub username later

theme:
  name: material
  palette:
    - primary: indigo
      accent: indigo
  features:
    - navigation.tabs        # Top horizontal navigation menu
    - search.suggest         # Live search bar as you type
    - content.code.copy      # Adds a "Copy Code" button to code blocks

nav:
  - Home: index.md
  - Lab Protocols: protocols.md
